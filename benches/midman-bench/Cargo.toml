[package]
name        = "midman-bench"
version     = "0.0.1"
edition     = "2021"
publish     = false
description = "Criterion benchmarks for the midman-ai crates, kept in their own package so the benchmark toolchain requirement does not reach the library crates. Also compiles the C baseline kernels the benchmarks compare against."
build       = "build.rs"

[lints]
workspace = true

[lib]
name = "midman_bench"
path = "src/lib.rs"
# The library holds the C wrappers and their tests, which `cargo test` runs. Without this,
# `cargo bench` also runs the library as a bench harness, which rejects criterion's options.
bench = false

[dependencies]
midman-foundation   = { path = "../../crates/midman-foundation" }
midman-model-config = { path = "../../crates/midman-model-config" }
# The `avx` feature makes the matrix-product benchmarks run the AVX kernels when the CPU
# has them, next to scalar twins that force the scalar kernels. Cargo unifies features
# across the workspace, so a build that includes this package also gets them for the
# library crates; the library crates' own `cargo test -p` runs do not.
midman-tensor       = { path = "../../crates/midman-tensor", features = ["avx"] }
midman-nn           = { path = "../../crates/midman-nn" }
midman-model        = { path = "../../crates/midman-model" }
midman-optim        = { path = "../../crates/midman-optim" }

# Compiles c/baseline_kernels.c. A build dependency only: nothing outside this
# package sees it.
[build-dependencies]
cc = "1"

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name    = "tensor_ops"
harness = false

[[bench]]
name    = "nn_layers"
harness = false

[[bench]]
name    = "model_step"
harness = false

[[bench]]
name    = "optim_step"
harness = false
