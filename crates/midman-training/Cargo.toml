[package]
name        = "midman-training"
version     = "0.0.1"
edition     = "2021"
description = "Training loop, loss computation, gradient accumulation, evaluation, distributed-training interfaces and run management."

[lints]
workspace = true

[lib]
name       = "midman_training"
crate-type = ["lib"]

[features]
# Use the AVX matrix kernels of midman-tensor on a CPU that has them (results are the same).
avx = ["midman-tensor/avx"]

[dependencies]
midman-foundation   = { path = "../midman-foundation" }
midman-tensor       = { path = "../midman-tensor" }
midman-nn           = { path = "../midman-nn" }
midman-model        = { path = "../midman-model" }
midman-model-config = { path = "../midman-model-config" }
midman-optim        = { path = "../midman-optim" }
midman-checkpoint   = { path = "../midman-checkpoint" }
midman-data         = { path = "../midman-data" }
