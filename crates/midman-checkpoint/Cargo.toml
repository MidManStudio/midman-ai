[package]
name        = "midman-checkpoint"
version     = "0.0.1"
edition     = "2021"
description = "Saving and loading model weights, optimizer state, training progress, metadata and checkpoint version migrations."

[lints]
workspace = true

[lib]
name       = "midman_checkpoint"
crate-type = ["lib"]

[dependencies]
midman-foundation = { path = "../midman-foundation" }
midman-tensor     = { path = "../midman-tensor" }

[dev-dependencies]
# For the end-to-end test that saves and loads a real model.
midman-model        = { path = "../midman-model" }
midman-model-config = { path = "../midman-model-config" }
midman-nn           = { path = "../midman-nn" }
