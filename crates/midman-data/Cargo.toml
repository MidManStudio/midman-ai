[package]
name        = "midman-data"
version     = "0.0.1"
edition     = "2021"
description = "Dataset ingestion, source manifests, filtering, deduplication, packing, sampling and batch construction."

[lints]
workspace = true

[lib]
name       = "midman_data"
crate-type = ["lib"]

[dependencies]
midman-foundation = { path = "../midman-foundation" }
midman-tokenizer  = { path = "../midman-tokenizer" }

[dev-dependencies]
# Only the end-to-end test uses them: it feeds a real batch to the model's loss.
midman-model        = { path = "../midman-model" }
midman-model-config = { path = "../midman-model-config" }
