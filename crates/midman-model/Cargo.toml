[package]
name        = "midman-model"
version     = "0.0.1"
edition     = "2021"
description = "MidMan model definition, forward pass, parameter registration and model construction."

[lints]
workspace = true

[lib]
name       = "midman_model"
crate-type = ["lib"]

[dependencies]
midman-foundation   = { path = "../midman-foundation" }
midman-model-config = { path = "../midman-model-config" }
midman-nn           = { path = "../midman-nn" }
midman-tensor       = { path = "../midman-tensor" }

[dev-dependencies]
# Only the training smoke test uses the optimizer; it moves to midman-training
# when that crate has a training loop.
midman-optim = { path = "../midman-optim" }
