# .github/workflows/ingest.yml
#
# midman-ai ingest: the first step of the corpus pipeline, on GitHub's machines.
#
# Two modes, chosen when you start it:
#
#   measure   (default) Reads the committed manifest (data/manifest.txt), applies the license
#             policy to it with the Rust code that training uses, fetches every accepted
#             source at exactly its pinned commit, looks in the top-level files of every
#             source that has no license for a statement against use (such a source is left
#             out if it has one), and counts what the remaining sources would give: code
#             and documentation files and megabytes by category (code is by suffix or name,
#             and for shell also scripts with a shell #! line; documentation is Markdown and
#             reStructuredText without release notes), where the documentation is, sources
#             with no file of their category, files that are not UTF-8, files with a very
#             long line, and everything fetched by extension. It also writes the list of
#             files training would read. Nothing is trained and no shard is written.
#
#   discover  Builds a NEW proposed manifest: the most downloaded crates on crates.io (Rust),
#             the most starred Rust repositories on GitHub (their license is read from the
#             root Cargo.toml when GitHub cannot name one) and a GitHub repository search
#             (shell), each pinned to the commit at the head of its default branch, with the
#             license policy's verdict for every one. The
#             manifest, the candidate lists and the verdicts are uploaded as an artifact. It
#             never changes the repository: to use a proposed manifest, put it at
#             data/manifest.txt.
#
# The license rule: permissive and weak copyleft licenses are accepted, and so is a source with
# no license at all, unless its own files say otherwise. A license that exists but could not
# be identified is refused. Sources you have looked at and want to keep although the notice
# scan flagged them go in data/notices-reviewed.txt.
#
# Helper script: scripts/ingest.py, tested by scripts/test_ingest.py. The license policy is
# in crates/midman-data (examples/check_manifest.rs); the script decides nothing about
# licenses. Notes: docs/ci-and-workflows.md.

name: midman-ai Ingest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'measure: fetch and count the committed manifest. discover: build a proposed manifest'
        type: choice
        default: measure
        options:
          - measure
          - discover
      baseline_note:
        description: 'Free-text label for this run, shown in the summary'
        type: string
        default: ''
      manifest:
        description: 'measure: path of the manifest in the repository'
        type: string
        default: data/manifest.txt
      rust_repos:
        description: 'discover: how many Rust repositories to take from crates.io (about 3 seconds each)'
        type: string
        default: '300'
      rust_stars_query:
        description: 'discover: GitHub repository search for Rust applications and libraries'
        type: string
        default: 'language:Rust stars:>2000'
      rust_stars_repos:
        description: 'discover: how many of those to take (0 leaves them out)'
        type: string
        default: '100'
      shell_query:
        description: 'discover: GitHub repository search for the shell sources'
        type: string
        default: 'language:Shell stars:>1000'
      shell_repos:
        description: 'discover: how many shell repositories to take'
        type: string
        default: '100'
      exclude:
        description: 'discover: source ids to leave out, separated by spaces'
        type: string
        default: 'microsoft/windows-rs sunfishcode/linux-raw-sys'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  measure:
    name: fetch and measure the manifest
    if: ${{ inputs.mode == 'measure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BASELINE_NOTE: ${{ inputs.baseline_note }}
      MANIFEST: ${{ inputs.manifest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Parser self-test
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Toolchain info
        id: toolchain
        run: |
          set -eu
          rustc --version
          cargo --version
          echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-midman-ingest-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-midman-ingest-${{ runner.os }}-${{ runner.arch }}-

      - name: Build the license check
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          echo "=== build ===" | tee ingest-raw.txt
          cargo build --release --locked -p midman-data --example check_manifest 2>&1 | tee -a ingest-raw.txt

      # The report (one line per source) goes to a file; the totals go to the raw log.
      - name: Apply the license policy
        id: policy
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          echo "=== policy ===" | tee -a ingest-raw.txt
          status=0
          ./target/release/examples/check_manifest "$MANIFEST" --accepted accepted.txt \
            > policy-report.tsv 2> policy-totals.txt || status=$?
          tee -a ingest-raw.txt < policy-totals.txt
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          note="Run ${{ github.run_number }} on $RUNNER_OS $RUNNER_ARCH, commit ${GITHUB_SHA}, manifest ${MANIFEST}, ${{ steps.toolchain.outputs.version }}"
          if [ -n "$BASELINE_NOTE" ]; then
            note="$note. $BASELINE_NOTE"
          fi
          python3 scripts/ingest.py report --report policy-report.tsv \
            --markdown "$GITHUB_STEP_SUMMARY" --note "$note" 2>&1 | tee -a ingest-raw.txt

      - name: Fetch the accepted sources
        id: fetch
        if: steps.policy.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          echo "=== fetch ===" | tee -a ingest-raw.txt
          df -h . | tee -a ingest-raw.txt
          python3 scripts/ingest.py fetch --manifest "$MANIFEST" --accepted accepted.txt \
            --dest data-src --drop-git 2>&1 | tee -a ingest-raw.txt
          df -h . | tee -a ingest-raw.txt
          du -sh data-src | tee -a ingest-raw.txt

      # Sources with no license are accepted unless their own files say otherwise: this is
      # the look in those files. usable.txt is the accepted list without the ones left out.
      - name: Look for notices in unlicensed sources
        id: notices
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          echo "=== notices ===" | tee -a ingest-raw.txt
          python3 scripts/ingest.py notices --manifest "$MANIFEST" --accepted accepted.txt \
            --dest data-src --out usable.txt --report notices.tsv \
            --reviewed data/notices-reviewed.txt \
            --markdown "$GITHUB_STEP_SUMMARY" 2>&1 | tee -a ingest-raw.txt

      - name: Measure
        id: measure
        if: steps.notices.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          echo "=== measure ===" | tee -a ingest-raw.txt
          python3 scripts/ingest.py measure --manifest "$MANIFEST" --accepted usable.txt \
            --dest data-src --out ingest-results.json \
            --markdown "$GITHUB_STEP_SUMMARY" 2>&1 | tee -a ingest-raw.txt

      # The list of files that training would read: category, kind (code or docs), source, path.
      - name: List the usable files
        id: files
        if: steps.notices.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          echo "=== files ===" | tee -a ingest-raw.txt
          python3 scripts/ingest.py files --manifest "$MANIFEST" --accepted usable.txt \
            --dest data-src --out files.tsv 2>&1 | tee -a ingest-raw.txt

      - name: Say what happened
        if: always()
        env:
          STEP_OUTCOMES: build=${{ steps.build.outcome }},policy=${{ steps.policy.outcome }},fetch=${{ steps.fetch.outcome }},notices=${{ steps.notices.outcome }},measure=${{ steps.measure.outcome }},files=${{ steps.files.outcome }}
        run: |
          {
            echo "### Steps"
            echo ""
            echo "$STEP_OUTCOMES" | tr ',' '\n' | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw log and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ingest-measure-${{ github.run_number }}
          path: |
            ingest-raw.txt
            ingest-results.json
            policy-report.tsv
            accepted.txt
            usable.txt
            notices.tsv
            files.tsv
          retention-days: 30
          if-no-files-found: warn

      - name: Fail if a step failed
        if: always()
        env:
          STEP_OUTCOMES: build=${{ steps.build.outcome }},policy=${{ steps.policy.outcome }},fetch=${{ steps.fetch.outcome }},notices=${{ steps.notices.outcome }},measure=${{ steps.measure.outcome }},files=${{ steps.files.outcome }}
        run: |
          set -eu
          case "$STEP_OUTCOMES" in
            *failure*|*cancelled*|*skipped*)
              echo "::error title=midman-ai Ingest::a step did not succeed (step outcomes: $STEP_OUTCOMES)"
              exit 1
              ;;
          esac

  discover:
    name: propose a manifest
    if: ${{ inputs.mode == 'discover' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASELINE_NOTE: ${{ inputs.baseline_note }}
      RUST_REPOS: ${{ inputs.rust_repos }}
      RUST_STARS_QUERY: ${{ inputs.rust_stars_query }}
      RUST_STARS_REPOS: ${{ inputs.rust_stars_repos }}
      SHELL_QUERY: ${{ inputs.shell_query }}
      SHELL_REPOS: ${{ inputs.shell_repos }}
      EXCLUDE: ${{ inputs.exclude }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Parser self-test
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Toolchain info
        id: toolchain
        run: |
          set -eu
          rustc --version
          cargo --version
          echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-midman-ingest-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-midman-ingest-${{ runner.os }}-${{ runner.arch }}-

      - name: Build the license check
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          echo "=== build ===" | tee ingest-raw.txt
          cargo build --release --locked -p midman-data --example check_manifest 2>&1 | tee -a ingest-raw.txt

      - name: List Rust repositories (crates.io)
        id: crates
        continue-on-error: true
        run: |
          set -o pipefail
          echo "=== crates ===" | tee -a ingest-raw.txt
          python3 scripts/ingest.py crates --count "$RUST_REPOS" --out candidates-rust.json 2>&1 | tee -a ingest-raw.txt

      # Rust repositories GitHub knows by stars. GitHub often cannot name the license of a
      # dual-licensed one (it says NOASSERTION), so the root Cargo.toml is read for those.
      - name: List Rust repositories (GitHub search)
        id: stars
        continue-on-error: true
        run: |
          set -o pipefail
          echo "=== rust by stars ===" | tee -a ingest-raw.txt
          if [ "$RUST_STARS_REPOS" = "0" ]; then
            echo "skipped (rust_stars_repos is 0)" | tee -a ingest-raw.txt
          else
            python3 scripts/ingest.py github --query "$RUST_STARS_QUERY" --category rust \
              --count "$RUST_STARS_REPOS" --cargo-license --out candidates-rust-stars.json 2>&1 | tee -a ingest-raw.txt
          fi

      - name: List shell repositories (GitHub search)
        id: shell
        continue-on-error: true
        run: |
          set -o pipefail
          echo "=== shell ===" | tee -a ingest-raw.txt
          python3 scripts/ingest.py github --query "$SHELL_QUERY" --category shell \
            --count "$SHELL_REPOS" --out candidates-shell.json 2>&1 | tee -a ingest-raw.txt

      - name: Pin every candidate to a commit
        id: manifest
        if: steps.crates.outcome == 'success' && steps.stars.outcome == 'success' && steps.shell.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          echo "=== manifest ===" | tee -a ingest-raw.txt
          set -- --candidates candidates-rust.json
          if [ -f candidates-rust-stars.json ]; then
            set -- "$@" candidates-rust-stars.json
          fi
          set -- "$@" candidates-shell.json --out proposed-manifest.txt
          for id in $EXCLUDE; do
            set -- "$@" --exclude "$id"
          done
          python3 scripts/ingest.py manifest "$@" 2>&1 | tee -a ingest-raw.txt

      - name: Apply the license policy
        id: policy
        if: steps.manifest.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          echo "=== policy ===" | tee -a ingest-raw.txt
          status=0
          ./target/release/examples/check_manifest proposed-manifest.txt --accepted accepted.txt \
            > policy-report.tsv 2> policy-totals.txt || status=$?
          tee -a ingest-raw.txt < policy-totals.txt
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          note="Run ${{ github.run_number }}, commit ${GITHUB_SHA}, ${{ steps.toolchain.outputs.version }}. Rust: top ${RUST_REPOS} crates.io repositories, plus ${RUST_STARS_REPOS} from ${RUST_STARS_QUERY}. Shell: ${SHELL_QUERY} (${SHELL_REPOS})."
          if [ -n "$BASELINE_NOTE" ]; then
            note="$note $BASELINE_NOTE"
          fi
          python3 scripts/ingest.py report --report policy-report.tsv \
            --markdown "$GITHUB_STEP_SUMMARY" --note "$note" 2>&1 | tee -a ingest-raw.txt

      - name: Say what happened
        if: always()
        env:
          STEP_OUTCOMES: build=${{ steps.build.outcome }},crates=${{ steps.crates.outcome }},stars=${{ steps.stars.outcome }},shell=${{ steps.shell.outcome }},manifest=${{ steps.manifest.outcome }},policy=${{ steps.policy.outcome }}
        run: |
          {
            echo "### Steps"
            echo ""
            echo "$STEP_OUTCOMES" | tr ',' '\n' | sed 's/^/- /'
            echo ""
            echo "The proposed manifest is in the artifact. To use it, put it at data/manifest.txt."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the proposed manifest and the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ingest-discover-${{ github.run_number }}
          path: |
            proposed-manifest.txt
            candidates-rust.json
            candidates-rust-stars.json
            candidates-shell.json
            policy-report.tsv
            accepted.txt
            ingest-raw.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Fail if a step failed
        if: always()
        env:
          STEP_OUTCOMES: build=${{ steps.build.outcome }},crates=${{ steps.crates.outcome }},stars=${{ steps.stars.outcome }},shell=${{ steps.shell.outcome }},manifest=${{ steps.manifest.outcome }},policy=${{ steps.policy.outcome }}
        run: |
          set -eu
          case "$STEP_OUTCOMES" in
            *failure*|*cancelled*|*skipped*)
              echo "::error title=midman-ai Ingest::a step did not succeed (step outcomes: $STEP_OUTCOMES)"
              exit 1
              ;;
          esac
